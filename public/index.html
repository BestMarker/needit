<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="index.html">Needit.</a>
        <div class="d-flex align-items-center">
            <a href="profile.html?user=me" id="navProfileLink" class="text-decoration-none">
                <span id="navKarma" class="badge bg-warning text-dark me-3 rounded-pill p-2"><i class="bi bi-star-fill"></i> <span id="karmaScore">0</span> Karma</span>
                <img id="navAvatar" src="" class="rounded-circle border me-2" style="width: 35px; height: 35px; object-fit: cover; display: none;">
                <span id="navUsername" class="me-3 fw-semibold text-muted text-dark"></span>
            </a>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill">Çıkış Yap</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 mb-4 d-none d-md-block">
            <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top: 80px;">
                <div class="card-body p-2">
                    <ul class="nav flex-column nav-pills custom-nav">
                        <li class="nav-item">
                            <a class="nav-link active rounded-3 mb-1" href="#" id="nav-feed"><i class="bi bi-house-door me-2"></i> Ana Sayfa</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link rounded-3 mb-1 text-dark" href="#" id="nav-dm" data-bs-toggle="modal" data-bs-target="#dmModal"><i class="bi bi-chat-dots me-2"></i> Mesajlar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Main Feed -->
        <div class="col-md-6 mb-4">
            <!-- Create Post Link Card -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body d-flex align-items-center">
                    <img id="indexAvatarImg" src="" class="post-avatar me-3 mb-0" style="width: 45px; height: 45px; object-fit: cover; display: none;">
                    <div class="post-avatar me-3 mb-0" style="width: 45px; height: 45px;" id="indexAvatar"></div>
                    <a href="create.html" class="form-control rounded-pill bg-light border-0 py-2 text-decoration-none text-muted d-flex align-items-center">
                        <span class="ps-2">Ne düşünüyorsun? Yeni bir gönderi oluştur...</span>
                    </a>
                </div>
            </div>

            <!-- Posts Container -->
            <div id="postsContainer">
                <div class="text-center text-muted py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Gönderiler yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- Right Sidebar (Empty/Trending) -->
        <div class="col-md-3 d-none d-md-block">
            <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top: 80px;">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-3">Sizin İçin Önerilenler</h6>
                    <p class="small text-muted">Burası şimdilik boş, ama yakında harika şeyler olacak!</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- DM Modal -->
<div class="modal fade" id="dmModal" tabindex="-1" aria-labelledby="dmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="dmModalLabel">Mesajlar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-0 h-100" style="min-height: 400px;">
            <!-- Users List -->
            <div class="col-4 border-end pe-3">
                <div id="dmUsersList" class="list-group list-group-flush border-0">
                    <div class="text-center text-muted small mt-3">Kullanıcılar yükleniyor...</div>
                </div>
            </div>
            <!-- Chat Area -->
            <div class="col-8 ps-3 d-flex flex-column">
                <div id="chatHeader" class="fw-bold mb-3 text-primary d-none">Seçili Kullanıcı</div>
                <div id="chatMessages" class="flex-grow-1 overflow-auto mb-3 bg-light rounded-3 p-3" style="max-height: 350px; min-height:350px;">
                    <div class="text-muted small text-center mt-5">Sohbet başlatmak için bir kullanıcı seçin.</div>
                </div>
                <form id="dmForm" class="d-none mt-auto d-flex">
                    <input type="text" id="dmInput" class="form-control rounded-pill bg-light border-0 me-2" placeholder="Mesaj yaz..." autocomplete="off">
                    <button type="submit" class="btn btn-primary rounded-circle"><i class="bi bi-send-fill"></i></button>
                </form>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
