<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needit - Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 text-primary fw-bold">Needit.</h2>
                    
                    <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Giriş Yap</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Kayıt Ol</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabsContent">
                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label text-muted">Kullanıcı Adı</label>
                                    <input type="text" class="form-control form-control-lg bg-soft" id="loginUsername" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted">Şifre</label>
                                    <input type="password" class="form-control form-control-lg bg-soft" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">Giriş Yap</button>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label text-muted">Kullanıcı Adı</label>
                                    <input type="text" class="form-control form-control-lg bg-soft" id="regUsername" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted">Şifre</label>
                                    <input type="password" class="form-control form-control-lg bg-soft" id="regPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">Kayıt Ol</button>
                            </form>
                        </div>
                    </div>

                    <div id="authAlert" class="alert mt-3 d-none" role="alert"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
